AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Xpenses backend API service

Globals:
  Function:
    Timeout: 60
    Runtime: python3.13
    MemorySize: 128

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment stage

Mappings:
  TableNames:
    dev:
      UsersTableName: xpenses-users-table-prod
      TransactionsTableName: xpenses-transactions-table-prod
      SubscriptionsTableName: xpenses-suscriptions-table-prod
    prod:
      UsersTableName: xpenses-users-table-prod
      TransactionsTableName: xpenses-transactions-table-prod
      SubscriptionsTableName: xpenses-suscriptions-table-prod

  CognitoConfig:
    dev:
      UserPoolId: us-east-1_O00lHTebz
      AppClientId: 6bc94amej9csqr0du5p3bdmcvf
      Region: us-east-1
    prod:
      UserPoolId: us-east-1_O00lHTebz
      AppClientId: 6bc94amej9csqr0du5p3bdmcvf
      Region: us-east-1

Resources:
  #########################################
  # Lambda Layer: shared models
  #########################################
  ModelsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub xpenses-models-${StageName}
      ContentUri: layers/models/
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13

  #########################################
  # API Gateway
  #########################################
  XpensesApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub XpensesApi-${StageName}
      StageName: !Ref StageName
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'*'"
        AllowMethods: "'*'"
      Auth:
        # No DefaultAuthorizer — most routes stay unprotected for now; this
        # authorizer is only attached explicitly to the routes that need it
        # (see each Function's Events.*.Properties.Auth.Authorizer below).
        Authorizers:
          CognitoAuthorizer:
            FunctionArn: !GetAtt CognitoAuthorizerFunction.Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ValidationExpression: "^Bearer .+$"
              ReauthorizeEvery: 300 # cache a valid decision for 5 minutes per token

  #########################################
  # Gateway Responses (CORS on API Gateway-level errors)
  #########################################
  # This is what actually fires for CognitoAuthorizerFunction's 401 (raising
  # Exception("Unauthorized")) — NOT a dedicated GatewayResponseUnauthorized
  # (ResponseType: UNAUTHORIZED). Confirmed empirically: UNAUTHORIZED never
  # applies to this failure mode (patched it with a debug marker + zero
  # wait, never appeared); DEFAULT_4XX does apply, it just needs a few
  # seconds to propagate after a deploy before it's visible — an earlier
  # test on DEFAULT_4XX gave a false negative from testing too soon after
  # patching. Safe to put an auth-specific message on the DEFAULT_4XX
  # catch-all here since our own Lambda-level 400/404 responses never go
  # through GatewayResponse at all — those are ordinary successful Lambda
  # executions that just happen to return a 4xx-flavored body.
  GatewayResponseDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref XpensesApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
      ResponseTemplates:
        application/json: !Sub |
          {
            "message": "Missing, invalid, or expired authentication token, or a malformed request. Check CloudWatch logs for auth-authorizer-${StageName} for the specific reason if this was an auth failure."
          }

  GatewayResponseDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref XpensesApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'*'"

  #########################################
  # Lambda: Cognito Authorizer (shared by any protected route)
  #########################################
  CognitoAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub auth-authorizer-${StageName}
      CodeUri: api/auth/authorizer/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !FindInMap
            - CognitoConfig
            - !Ref StageName
            - UserPoolId

          COGNITO_APP_CLIENT_ID: !FindInMap
            - CognitoConfig
            - !Ref StageName
            - AppClientId

          COGNITO_REGION: !FindInMap
            - CognitoConfig
            - !Ref StageName
            - Region

  #########################################
  # Lambda: Auth Sync
  #########################################
  AuthSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub auth-sync-${StageName}
      CodeUri: api/auth/sync/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer

      Environment:
        Variables:
          USERS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - UsersTableName

          COGNITO_USER_POOL_ID: !FindInMap
            - CognitoConfig
            - !Ref StageName
            - UserPoolId

          COGNITO_APP_CLIENT_ID: !FindInMap
            - CognitoConfig
            - !Ref StageName
            - AppClientId

          COGNITO_REGION: !FindInMap
            - CognitoConfig
            - !Ref StageName
            - Region

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}
                  - UsersTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - UsersTableName

      Events:
        AuthSync:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /auth/sync
            Method: POST

  #########################################
  # Lambda: Transactions CRUD (protected by CognitoAuthorizer)
  #########################################
  AddTransactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub transactions-add-${StageName}
      CodeUri: api/transactions/add/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          TRANSACTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - TransactionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TransactionsTable}
                  - TransactionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - TransactionsTableName
      Events:
        AddTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /transactions
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  GetTransactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub transactions-get-${StageName}
      CodeUri: api/transactions/get/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          TRANSACTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - TransactionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TransactionsTable}
                  - TransactionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - TransactionsTableName
      Events:
        GetTransactions:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /transactions
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  EditTransactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub transactions-edit-${StageName}
      CodeUri: api/transactions/edit/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          TRANSACTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - TransactionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TransactionsTable}
                  - TransactionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - TransactionsTableName
      Events:
        EditTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /transactions
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteTransactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub transactions-delete-${StageName}
      CodeUri: api/transactions/delete/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          TRANSACTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - TransactionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TransactionsTable}
                  - TransactionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - TransactionsTableName
      Events:
        DeleteTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /transactions
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  #########################################
  # Lambda: Subscriptions CRUD (protected by CognitoAuthorizer)
  #########################################
  AddSubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub subscriptions-add-${StageName}
      CodeUri: api/subscriptions/add/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - SubscriptionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTable}
                  - SubscriptionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - SubscriptionsTableName
      Events:
        AddSubscription:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /subscriptions
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  GetSubscriptionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub subscriptions-get-${StageName}
      CodeUri: api/subscriptions/get/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - SubscriptionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTable}
                  - SubscriptionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - SubscriptionsTableName
      Events:
        GetSubscriptions:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /subscriptions
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  EditSubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub subscriptions-edit-${StageName}
      CodeUri: api/subscriptions/edit/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - SubscriptionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTable}
                  - SubscriptionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - SubscriptionsTableName
      Events:
        EditSubscription:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /subscriptions
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteSubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub subscriptions-delete-${StageName}
      CodeUri: api/subscriptions/delete/
      Handler: app.lambda_handler
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - SubscriptionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTable}
                  - SubscriptionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - SubscriptionsTableName
      Events:
        DeleteSubscription:
          Type: Api
          Properties:
            RestApiId: !Ref XpensesApi
            Path: /subscriptions
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  #########################################
  # Lambda: Daily Billing (subscriptions -> pending transactions)
  #########################################
  DailyBillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub billing-daily-${StageName}
      CodeUri: api/billing/daily/
      Handler: app.lambda_handler
      Timeout: 300 # batch job, not request/response — more headroom than the API Globals default
      Layers:
        - !Ref ModelsLayer
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - SubscriptionsTableName
          TRANSACTIONS_TABLE: !FindInMap
            - TableNames
            - !Ref StageName
            - TransactionsTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTable}/index/BillingDayStatusIndex
                  - SubscriptionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - SubscriptionsTableName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub
                  - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TransactionsTable}
                  - TransactionsTable: !FindInMap
                      - TableNames
                      - !Ref StageName
                      - TransactionsTableName
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # 06:00 UTC daily — adjust to taste, this is just a placeholder slot.
            Schedule: cron(0 6 * * ? *)
            Name: !Sub xpenses-daily-billing-${StageName}
            Description: Converts due subscriptions into pending transactions
            Enabled: true

Outputs:
  ApiUrl:
    Description: Base URL for the API
    Value: !Sub "https://${XpensesApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
